name: Deploy static studio to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: design-package/package-lock.json
      - run: npm ci --prefix design-package --ignore-scripts
      - run: npm run check && npm run build && npm test
      - run: npm audit --prefix design-package --audit-level=high
      - name: Scan history and deployable files
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history -m' --redact --no-banner
          "$RUNNER_TEMP/gitleaks" dir build --redact --no-banner
      - name: Package validated files
        id: package
        run: |
          tar -czf release-artifact/production.tar.gz build firebase.json -C release-artifact files.sha256 provenance.json
          checksum=$(sha256sum release-artifact/production.tar.gz | cut -d ' ' -f 1)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-hosting-${{ github.sha }}
          path: release-artifact/production.tar.gz
          retention-days: 30
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-hosting-${{ github.sha }}
      - name: Verify artifact before credentials
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          echo "$EXPECTED_SHA256  production.tar.gz" | sha256sum -c -
          tar -xzf production.tar.gz
          sha256sum -c files.sha256
          node -e 'const p=require("./provenance.json"); if(p.commit!==process.env.EXPECTED_COMMIT) process.exit(1)'
      - name: Install deployment tool before credentials
        run: npm install --ignore-scripts --no-fund --no-audit --prefix "$RUNNER_TEMP/deploy-tool" firebase-tools@15.32.1
      - name: Deploy exact validated artifact to Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUDHANPORTFOLIOWEBSITE }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-hosting-credentials.json
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node -e 'require("node:fs").writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,process.env.FIREBASE_SERVICE_ACCOUNT_JSON,{mode:0o600})'
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node <<'JS'
          const {GoogleAuth}=require(process.env.RUNNER_TEMP+'/deploy-tool/node_modules/google-auth-library');
          const fs=require('node:fs');
          (async()=>{
            const client=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform','https://www.googleapis.com/auth/firebase']}).getClient();
            const response=await client.request({url:'https://firebasehosting.googleapis.com/v1beta1/sites/sudhanportfoliowebsite/releases?pageSize=1'});
            const release=response.data.releases?.[0];
            if(!release?.version?.name)throw new Error('No previous release');
            fs.writeFileSync('rollback.json',JSON.stringify({previousVersion:release.version.name,previousRelease:release.name,newCommit:process.env.DEPLOY_COMMIT},null,2));
            console.log('Previous Hosting version recorded for rollback.');
          })().catch(()=>{console.error('Could not record previous Hosting version; deployment stopped.');process.exit(1)});
          JS
          node "$RUNNER_TEMP/deploy-tool/node_modules/firebase-tools/lib/bin/firebase.js" deploy --only hosting --project sudhanportfoliowebsite --config firebase.json --non-interactive
      - name: Verify serving content
        run: |
          node <<'JS'
          const fs=require('node:fs');const crypto=require('node:crypto');
          (async()=>{
            const manifest=fs.readFileSync('files.sha256','utf8').trim().split('\n');
            for(const host of ['https://sudhanportfoliowebsite.web.app','https://sudharsana.dev']){
              for(const line of manifest){
                const [hash,path]=line.split('  ');if(!path.startsWith('build/')||!path.endsWith('.html')||path.endsWith('404.html'))continue;
                const route=path==='build/index.html'?'/':'/'+path.slice(6).replace(/index\.html$/,'');
                let matched=false;
                for(let attempt=0;attempt<5;attempt++){
                  const response=await fetch(host+route,{headers:{'Cache-Control':'no-cache'}});
                  const actual=crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
                  if(response.status===200&&actual===hash){matched=true;break;}
                  await new Promise(resolve=>setTimeout(resolve,5000));
                }
                if(!matched)throw new Error('Serving content mismatch: '+host+route);
              }
              const missing=await fetch(host+'/release-check-missing-page/');
              if(missing.status!==404)throw new Error('Missing route did not return 404: '+host);
              const home=await fetch(host+'/');
              if(!home.headers.get('content-security-policy')?.includes("connect-src 'none'"))throw new Error('Missing production CSP: '+host);
              if(home.headers.get('x-robots-tag')?.includes('noindex'))throw new Error('Production is marked noindex: '+host);
            }
            console.log('Provider and custom domain serve the exact validated pages, CSP, and 404.');
          })().catch(error=>{console.error(error.message);process.exit(1)});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hosting-release-${{ github.sha }}
          path: |
            rollback.json
            provenance.json
          retention-days: 30
